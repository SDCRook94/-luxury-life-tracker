<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Luxury Life</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f5f3f0;
  --panel:#fff;
  --soft:#f0ede9;
  --text:#242321;
  --muted:#817b74;
  --accent:#756b63;
  --green:#5f8b6b;
  --purple:#8a718e;
  --gold:#c99a3d;
  --border:#e2ded9;
  --shadow:0 10px 30px rgba(45,38,32,.07)
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

body{min-height:100vh}

button,input{font:inherit}
button{cursor:pointer}

.app{
  width:100%;
  max-width:1080px;
  margin:auto;
  min-height:100vh;
  padding-bottom:105px
}

.header{
  padding:30px 18px 22px;
  text-align:center;
  background:rgba(245,243,240,.94);
  border-bottom:1px solid var(--border)
}

.logo{
  margin:0;
  font-size:clamp(30px,7vw,50px);
  font-weight:800;
  letter-spacing:-1.8px
}

.logo span{color:var(--accent)}

.subtitle{
  margin-top:7px;
  color:var(--muted);
  font-size:15px
}

.auth-wrap{padding:22px 18px}

.auth-card,.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:var(--shadow)
}

.auth-card{
  padding:20px;
  max-width:700px;
  margin:auto
}

.tabs{
  display:flex;
  background:var(--soft);
  border:1px solid var(--border);
  border-radius:16px;
  padding:4px;
  margin-bottom:20px
}

.tab{
  flex:1;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:13px 10px;
  border-radius:13px;
  font-weight:700
}

.tab.active{
  background:var(--text);
  color:#fff
}

label{
  display:block;
  margin:17px 0 7px;
  font-weight:700;
  font-size:15px
}

input{
  width:100%;
  border:1px solid var(--border);
  border-radius:14px;
  background:#fff;
  color:var(--text);
  padding:14px;
  outline:none
}

input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(117,107,99,.12)
}

.primary{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  margin-top:20px;
  color:#fff;
  font-size:16px;
  font-weight:800;
  background:var(--text)
}

.message{
  padding:13px 15px;
  border-radius:14px;
  margin:12px 0;
  display:none
}

.message.error{
  display:block;
  color:#9a4e5a;
  background:#fff0f2;
  border:1px solid #efd1d6
}

.message.success{
  display:block;
  color:#4f775a;
  background:#eef7f0;
  border:1px solid #cfe4d3
}

.hidden{display:none!important}

.dashboard{padding:18px}

.profile{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:17px;
  border-radius:20px;
  background:var(--panel);
  border:1px solid var(--border);
  box-shadow:var(--shadow)
}

.profile-left{
  display:flex;
  align-items:center;
  gap:13px
}

.avatar{
  width:56px;
  height:56px;
  border-radius:17px;
  display:grid;
  place-items:center;
  font-size:28px;
  background:var(--soft)
}

.username{
  font-size:21px;
  font-weight:800
}

.player-tag{
  color:var(--muted);
  margin-top:3px
}

.secondary,.back,.id-copy{
  border:1px solid var(--border);
  background:var(--soft);
  color:var(--text);
  border-radius:12px;
  padding:10px 14px;
  font-weight:700
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:16px 0
}

.stat{
  padding:15px 13px;
  border-radius:17px;
  background:var(--panel);
  border:1px solid var(--border)
}

.stat strong{
  display:block;
  font-size:25px
}

.stat span{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  font-weight:700
}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:25px 0 14px
}

.page-title h2{
  margin:0;
  font-size:28px
}

.category-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px
}

.category{
  min-height:145px;
  border:1px solid var(--border);
  border-radius:19px;
  padding:17px;
  background:var(--panel);
  box-shadow:var(--shadow);
  overflow:hidden
}

.category h3{
  margin:0 0 7px;
  font-size:18px
}

.category p{
  margin:0;
  color:var(--muted);
  font-size:14px
}

.progress{
  height:7px;
  background:var(--soft);
  border-radius:99px;
  overflow:hidden;
  margin-top:17px
}

.progress i{
  display:block;
  height:100%;
  background:var(--accent);
  border-radius:99px
}

.category button{
  width:100%;
  margin-top:13px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  color:var(--text);
  font-weight:700;
  background:var(--soft)
}

.cards-panel{
  margin-top:18px;
  padding:16px
}

.notice{
  padding:13px;
  background:var(--soft);
  border:1px solid var(--border);
  border-radius:14px;
  color:var(--muted);
  margin:12px 0;
  line-height:1.55
}

.cards-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:11px;
  margin-top:16px
}

.card{
  position:relative;
  min-height:190px;
  border-radius:18px;
  padding:9px;
  background:#f0eeeb;
  border:2px solid #fff;
  box-shadow:0 5px 16px rgba(45,38,32,.08);
  overflow:hidden
}

.card.gold{
  background:#f3ead5;
  border-color:#ead7aa
}

.card.owned{
  box-shadow:
    0 0 0 2px var(--green),
    0 7px 18px rgba(95,139,107,.12)
}

.card.wanted{
  box-shadow:
    0 0 0 2px var(--purple),
    0 7px 18px rgba(138,113,142,.12)
}

.card.disabled{opacity:.72}

.card-emoji{
  height:112px;
  display:grid;
  place-items:center;
  font-size:55px;
  text-shadow:0 3px 8px rgba(0,0,0,.12)
}

.card-name{
  text-align:center;
  font-weight:800;
  font-size:13px;
  text-transform:uppercase;
  line-height:1.1
}

.card-status{
  position:absolute;
  top:7px;
  right:7px;
  border-radius:9px;
  padding:4px 6px;
  font-size:9px;
  font-weight:800;
  background:rgba(255,255,255,.88);
  color:var(--text)
}

.gold-label{color:#9b7429}

.card-actions{
  display:flex;
  gap:5px;
  margin-top:8px
}

.card-actions button{
  flex:1;
  border:0;
  border-radius:9px;
  padding:7px 3px;
  background:#e2ddd7;
  color:var(--text);
  font-size:9px;
  font-weight:800
}

.card-actions button.active{
  background:var(--green);
  color:#fff
}

.card-actions button.want.active{
  background:var(--purple);
  color:#fff
}

.search{margin:15px 0}

.trade-card{
  padding:16px;
  border-radius:18px;
  background:var(--panel);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  margin-bottom:12px
}

.trade-player{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:13px
}

.trade-player strong{font-size:17px}

.trade-cards{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px
}

.mini-card{
  min-width:105px;
  padding:9px;
  border-radius:13px;
  background:#f0eeeb;
  border:1px solid var(--border)
}

.mini-card.gold{display:none}

.mini-emoji{
  text-align:center;
  font-size:30px
}

.mini-name{
  font-size:10px;
  font-weight:800;
  text-align:center;
  margin-top:5px
}

.trade-filter{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:13px
}

.trade-filter button{
  white-space:nowrap;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  padding:9px 12px;
  border-radius:11px
}

.trade-filter button.active{
  background:var(--text);
  color:#fff
}

.empty{
  text-align:center;
  padding:32px 15px;
  color:var(--muted)
}

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:13px;
  transform:translateX(-50%);
  width:min(92%,680px);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  padding:6px;
  border-radius:20px;
  background:rgba(255,255,255,.94);
  border:1px solid var(--border);
  box-shadow:0 12px 35px rgba(45,38,32,.12);
  backdrop-filter:blur(16px);
  z-index:50
}

.nav-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  border-radius:15px;
  padding:10px 8px;
  font-weight:800
}

.nav-btn.active{
  background:var(--text);
  color:#fff
}

.nav-icon{
  display:block;
  font-size:21px;
  margin-bottom:3px
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(35,31,27,.45);
  display:grid;
  place-items:center;
  padding:18px;
  z-index:100
}

.modal-box{
  width:min(100%,650px);
  max-height:85vh;
  overflow:auto;
  border-radius:22px;
  background:#fff;
  border:1px solid var(--border);
  padding:19px;
  box-shadow:0 20px 60px rgba(0,0,0,.18)
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.modal-head h3{
  margin:0;
  font-size:22px
}

.close{
  border:0;
  background:var(--soft);
  color:var(--text);
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:20px
}

@media(max-width:650px){
  .profile{align-items:flex-start}
  .profile .secondary{font-size:12px}
  .category-grid{grid-template-columns:1fr}
  .cards-grid{grid-template-columns:repeat(2,1fr)}
  .card{min-height:175px}
  .card-emoji{height:105px}
}

@media(max-width:390px){
  .card-name{font-size:12px}
}
</style>
</head>
